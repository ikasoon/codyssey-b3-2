[project]
name = "b3-2"
version = "0.1.0"
description = "Git 변경 사항으로 커밋 메시지와 PR 초안을 생성하는 Python CLI"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.1,<3",
    "pydantic-ai-slim[anthropic,openai,openrouter]>=2.54.0,<3",
    "pydantic-settings>=2.12,<3",
    "python-dotenv>=1.2.4,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
